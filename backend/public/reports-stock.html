<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Report — BiteFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="reports-stock" class="report-print">

<main class="main-content">

  <div class="print-report-head">
    <div class="prh-brand">BITEFLOW</div>
    <div class="prh-title">Stock Report</div>
    <div class="prh-meta">Generated: <span class="print-date">—</span></div>
  </div>

  <div class="page-head">
    <div>
      <h4 style="font-weight:800;margin-bottom:2px;">Stock Report</h4>
      <span class="text-secondary" style="font-size:13px;">Current inventory levels and total value on hand.</span>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="window.print()"><i class="fa-solid fa-print me-1"></i>Print Report</button>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent blue"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-blue-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-boxes-stacked"></i></div>
          <div><div class="kpi-label">Ingredients</div><div class="kpi-value" style="font-size:20px;" id="sCount">0</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent green"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-green-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-coins"></i></div>
          <div><div class="kpi-label">Stock Value</div><div class="kpi-value" style="font-size:20px;" id="sValue">Rs 0</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent amber"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-amber-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-triangle-exclamation"></i></div>
          <div><div class="kpi-label">Low Stock</div><div class="kpi-value" style="font-size:20px;" id="sLow">0</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent red"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-red-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-circle-xmark"></i></div>
          <div><div class="kpi-label">Out of Stock</div><div class="kpi-value" style="font-size:20px;" id="sOut">0</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="filter-bar">
      <div class="search-box" style="flex:1;min-width:200px;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="stockSearch" placeholder="Search ingredients..." style="width:100%;">
      </div>
      <div class="filter-group">
        <select class="form-select form-select-sm" id="stockLevel" style="width:auto;">
          <option value="All">All Levels</option>
          <option value="ok">In Stock</option>
          <option value="low">Low</option>
          <option value="out">Out</option>
        </select>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Ingredient</th>
            <th>Category</th>
            <th class="text-center">On Hand</th>
            <th class="text-center">Min Level</th>
            <th class="text-end">Unit Cost</th>
            <th class="text-end">Stock Value</th>
            <th style="width:110px;">Status</th>
          </tr>
        </thead>
        <tbody id="stockBody"></tbody>
        <tfoot id="stockFoot"></tfoot>
      </table>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/helpers.js"></script>
<script src="../assets/js/components.js"></script>
<script>
function level(i) {
  if (i.qty <= 0) return 'out_of_stock';
  if (i.qty <= i.minQty) return 'low';
  return 'available';
}

function renderStockReport() {
  const q = (document.getElementById('stockSearch').value || '').toLowerCase();
  const lvl = document.getElementById('stockLevel').value;
  const list = DB.ingredients.filter(function (i) {
    const okQ = !q || i.name.toLowerCase().includes(q) || i.category.toLowerCase().includes(q);
    const okL = lvl === 'All' || level(i) === lvl;
    return okQ && okL;
  });

  const all = DB.ingredients;
  document.getElementById('sCount').textContent = all.length;
  document.getElementById('sValue').textContent = formatPKR(all.reduce((s, i) => s + i.qty * i.cost, 0));
  document.getElementById('sLow').textContent = all.filter(i => i.qty > 0 && i.qty <= i.minQty).length;
  document.getElementById('sOut').textContent = all.filter(i => i.qty <= 0).length;

  const body = document.getElementById('stockBody');
  if (!list.length) {
    body.innerHTML = emptyRow(7, 'No ingredients found', 'Try changing the filters.');
    document.getElementById('stockFoot').innerHTML = '';
    return;
  }
  body.innerHTML = list.map(function (i) {
    const l = level(i);
    return '<tr class="' + (l === 'low' ? 'table-warning' : l === 'out_of_stock' ? '' : '') + '">' +
      '<td class="cell-fw">' + esc(i.name) + (l === 'out_of_stock' ? ' <i class="fa-solid fa-triangle-exclamation text-danger" title="Out of stock"></i>' : '') + '</td>' +
      '<td>' + esc(i.category) + '</td>' +
      '<td class="text-center"><b>' + i.qty + '</b> ' + esc(i.unit) + '</td>' +
      '<td class="text-center text-secondary">' + i.minQty + ' ' + esc(i.unit) + '</td>' +
      '<td class="text-end">' + formatPKR(i.cost) + '</td>' +
      '<td class="text-end cell-fw">' + formatPKR(i.qty * i.cost) + '</td>' +
      '<td>' + statusBadge(l) + '</td></tr>';
  }).join('');
  document.getElementById('stockFoot').innerHTML =
    '<tr class="table-foot"><td colspan="5" class="text-end">Total (filtered):</td>' +
    '<td class="text-end">' + formatPKR(list.reduce((s, i) => s + i.qty * i.cost, 0)) + '</td><td></td></tr>';
}

document.getElementById('stockSearch').addEventListener('keyup', renderStockReport);
document.getElementById('stockLevel').addEventListener('change', renderStockReport);

document.addEventListener('DOMContentLoaded', renderStockReport);
</script>
</body>
</html>
