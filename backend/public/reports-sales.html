<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Report — BiteFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="reports-sales" class="report-print">

<main class="main-content">

  <div class="print-report-head">
    <div class="prh-brand">BITEFLOW</div>
    <div class="prh-title">Sales Report</div>
    <div class="prh-meta">Period: <span id="prhPeriod">Today</span> · Generated: <span class="print-date">—</span></div>
  </div>

  <div class="page-head">
    <div>
      <h4 style="font-weight:800;margin-bottom:2px;">Sales Report</h4>
      <span class="text-secondary" style="font-size:13px;">Revenue, orders and tax collected over any period.</span>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="window.print()"><i class="fa-solid fa-print me-1"></i>Print Report</button>
    </div>
  </div>

  <div class="d-flex gap-2 mb-3" id="rangeBtns">
    <button type="button" class="menu-cat-btn active" data-range="today">Today</button>
    <button type="button" class="menu-cat-btn" data-range="week">This Week</button>
    <button type="button" class="menu-cat-btn" data-range="month">This Month</button>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent green"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-green-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-sack-dollar"></i></div>
          <div><div class="kpi-label">Net Sales</div><div class="kpi-value" style="font-size:20px;" id="rSales">Rs 0</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent blue"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-blue-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-receipt"></i></div>
          <div><div class="kpi-label">Orders</div><div class="kpi-value" style="font-size:20px;" id="rOrders">0</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent violet"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-violet-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-cart-flatbed"></i></div>
          <div><div class="kpi-label">Items Sold</div><div class="kpi-value" style="font-size:20px;" id="rItems">0</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent amber"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-amber-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-hand-holding-dollar"></i></div>
          <div><div class="kpi-label">Tax Collected</div><div class="kpi-value" style="font-size:20px;" id="rTax">Rs 0</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-7">
      <div class="card h-100">
        <div class="card-header"><span>Sales Trend</span><span class="sub" id="chartSub">Hourly sales</span></div>
        <div class="card-body"><div class="bar-chart" id="salesChart"></div></div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card h-100">
        <div class="card-header"><span>Sales by Type</span></div>
        <div class="card-body" id="typeBreak"></div>
      </div>
    </div>
  </div>

  <div class="card mt-3">
    <div class="card-header"><span>Daily Breakdown</span></div>
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr><th>Date</th><th class="text-center">Orders</th><th class="text-center">Items</th><th class="text-end">Gross</th><th class="text-end">Discounts</th><th class="text-end">Tax</th><th class="text-end">Net Sales</th></tr>
        </thead>
        <tbody id="dailyBody"></tbody>
      </table>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/helpers.js"></script>
<script src="../assets/js/components.js"></script>
<script>
const RANGES = {
  today: { label: 'Today', days: ['09 Aug 2024'] },
  week: { label: 'This Week', days: ['04 Aug 2024', '05 Aug 2024', '06 Aug 2024', '07 Aug 2024', '08 Aug 2024', '09 Aug 2024'] },
  month: { label: 'This Month', days: ['01 Aug 2024', '02 Aug 2024', '03 Aug 2024', '04 Aug 2024', '05 Aug 2024', '06 Aug 2024', '07 Aug 2024', '08 Aug 2024', '09 Aug 2024', '10 Aug 2024', '11 Aug 2024', '12 Aug 2024', '13 Aug 2024'] }
};
let curRange = 'today';

function ordersIn(days) {
  return DB.orders.filter(o => days.includes(o.date) && o.status !== 'hold' && o.status !== 'cancelled');
}

function renderSalesReport() {
  const d = RANGES[curRange];
  const orders = ordersIn(d.days);
  const sales = orders.reduce((s, o) => s + o.total, 0);
  const tax = orders.reduce((s, o) => s + o.tax, 0);
  const items = orders.reduce((s, o) => s + o.items.reduce((a, i) => a + i.qty, 0), 0);
  document.getElementById('rSales').textContent = formatPKR(sales);
  document.getElementById('rOrders').textContent = orders.length;
  document.getElementById('rItems').textContent = items;
  document.getElementById('rTax').textContent = formatPKR(tax);

  const byType = {};
  orders.forEach(o => { byType[o.type] = (byType[o.type] || 0) + o.total; });
  const typeMax = Math.max(1, ...Object.values(byType));
  document.getElementById('typeBreak').innerHTML = Object.keys(byType).map(function (t) {
    const amt = byType[t];
    return '<div class="bs-item">' +
      '<span class="rank-chip" style="background:var(--brand-soft);color:var(--brand-dark);width:34px;height:34px;">' + esc(t[0]) + '</span>' +
      '<div class="bs-meta"><div class="d-flex justify-content-between"><span class="bs-name">' + typeBadge(t) + '</span>' +
      '<span class="bs-amt">' + formatPKR(amt) + '</span></div>' +
      '<div class="progress mt-1"><div class="progress-bar" style="width:' + Math.round((amt / typeMax) * 100) + '%"></div></div>' +
      '<div class="bs-sub">' + Math.round((amt / sales) * 100) + '% of net sales</div></div></div>';
  }).join('') || '<div class="empty-state"><div class="es-icon"><i class="fa-regular fa-chart-bar"></i></div><h6>No sales</h6><p>No orders in this period.</p></div>';

  const groups = d.days.map(function (day) {
    const dayOrders = orders.filter(o => o.date === day);
    const amt = dayOrders.reduce((s, o) => s + o.total, 0);
    return { label: day.split(' ')[0] + ' ' + day.split(' ')[1], bars: [{ h: amt ? Math.round((amt / sales) * 100) : 2, title: day + ': ' + formatPKR(amt) }] };
  });
  barChart('salesChart', groups);
  document.getElementById('chartSub').textContent = d.label + ' — daily sales';
  document.getElementById('prhPeriod').textContent = d.label;

  const dailyBody = document.getElementById('dailyBody');
  if (!orders.length) {
    dailyBody.innerHTML = emptyRow(7, 'No orders in this period', 'Sales will appear here.');
    return;
  }
  const byDay = {};
  orders.forEach(o => { byDay[o.date] = byDay[o.date] || []; byDay[o.date].push(o); });
  dailyBody.innerHTML = Object.keys(byDay).map(function (day) {
    const os = byDay[day];
    const gross = os.reduce((s, o) => s + o.subtotal, 0);
    const disc = os.reduce((s, o) => s + o.discount, 0);
    const tx = os.reduce((s, o) => s + o.tax, 0);
    const net = os.reduce((s, o) => s + o.total, 0);
    const it = os.reduce((s, o) => s + o.items.reduce((a, i) => a + i.qty, 0), 0);
    return '<tr><td class="cell-fw">' + day + '</td>' +
      '<td class="text-center">' + os.length + '</td>' +
      '<td class="text-center">' + it + '</td>' +
      '<td class="text-end">' + formatPKR(gross) + '</td>' +
      '<td class="text-end text-danger">-' + formatPKR(disc) + '</td>' +
      '<td class="text-end">' + formatPKR(tx) + '</td>' +
      '<td class="text-end cell-fw">' + formatPKR(net) + '</td></tr>';
  }).join('');
}

document.querySelectorAll('#rangeBtns [data-range]').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('#rangeBtns [data-range]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    curRange = b.dataset.range;
    renderSalesReport();
  });
});

document.addEventListener('DOMContentLoaded', renderSalesReport);
</script>
</body>
</html>
