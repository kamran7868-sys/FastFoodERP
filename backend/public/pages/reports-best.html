<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Selling Items — BiteFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <style>
    /* ── Print styles — Best Selling Report ── */
    @media print {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;

      /* Hide everything except main-content */
      .bf-sidebar, .bf-topbar, .bf-overlay,
      .page-head .actions, .no-print { display: none !important; }

      body { background: #fff !important; margin: 0 !important; }

      .main-content {
        margin-left: 0 !important;
        padding: 0 !important;
      }

      /* Report header — visible only in print */
      .rpt-print-header {
        display: block !important;
        text-align: center;
        padding-bottom: 12px;
        margin-bottom: 16px;
        border-bottom: 2px solid #111;
      }

      /* Cards */
      .card {
        border: 1px solid #ddd !important;
        box-shadow: none !important;
        break-inside: avoid;
        margin-bottom: 14px;
      }
      .card-header {
        background: #f5f5f5 !important;
        border-bottom: 1px solid #ddd !important;
        padding: 10px 14px !important;
        font-weight: 700 !important;
      }

      /* Tables */
      .table th { background: #f0f0f0 !important; border-bottom: 1px solid #999 !important; }
      .table td, .table th { border: 1px solid #ddd; padding: 7px 10px; font-size: 12px; }
      .table tbody tr:hover td { background: transparent !important; }

      /* Progress bars */
      .progress { background: #eee !important; }
      .progress-bar { background: #EA580C !important; }

      /* Rank chip */
      .rank-chip.top { background: #EA580C !important; color: #fff !important; }

      /* KPI/stat mini boxes */
      .stat-box { background: #f8f8f8 !important; border: 1px solid #eee !important; border-radius: 8px; }

      /* Row layout fix for print */
      .row { display: flex !important; flex-wrap: wrap !important; }
      .col-lg-7 { flex: 0 0 58%; max-width: 58%; }
      .col-lg-5 { flex: 0 0 40%; max-width: 40%; padding-left: 14px; }

      /* Chart replacement: shown in print, hidden on screen */
      .print-bar-chart { display: block !important; }
      .screen-bar-chart { display: none !important; }

      /* Highlight block */
      #highlight { padding: 10px !important; }
      #highlight h5 { font-size: 15px !important; }
    }

    /* Screen: print-bar-chart hidden */
    .print-bar-chart { display: none; }
    .screen-bar-chart { display: block; }

    /* Print bar chart — horizontal bar table */
    .pbc-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .pbc-label {
      width: 140px;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      color: #374151;
      font-size: 11px;
    }
    .pbc-track {
      flex: 1;
      height: 16px;
      background: #F3F4F6;
      border-radius: 3px;
      overflow: hidden;
    }
    .pbc-fill {
      height: 100%;
      background: #EA580C;
      border-radius: 3px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .pbc-val {
      width: 36px;
      text-align: right;
      font-weight: 700;
      color: #111;
      font-size: 11px;
      flex-shrink: 0;
    }

    /* Screen-only: stat boxes */
    .stat-box-inner {
      background: var(--bg, #F8FAFC);
      border-radius: 12px;
    }
  </style>
</head>
<body data-page="reports-best">

<main class="main-content">

  <!-- Print-only header (hidden on screen) -->
  <div class="rpt-print-header" style="display:none;">
    <div style="font-size:18px;font-weight:800;letter-spacing:.5px;">BITEFLOW</div>
    <div style="font-size:14px;font-weight:600;margin-top:2px;">Best Selling Items</div>
    <div style="font-size:12px;color:#555;margin-top:3px;">Generated: <span class="print-date">—</span></div>
  </div>

  <div class="page-head">
    <div>
      <h4 style="font-weight:800;margin-bottom:2px;">Best Selling Items</h4>
      <span class="text-secondary" style="font-size:13px;">Top products by quantity and revenue — across all orders.</span>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="window.print()">
        <i class="fa-solid fa-print me-1"></i>Print Report
      </button>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-7">
      <div class="card h-100">
        <div class="card-header"><span>Top 10 — Quantity Sold</span></div>
        <div class="card-body">
          <!-- Screen chart (flex bar chart) -->
          <div class="screen-bar-chart bar-chart" id="topChart"></div>
          <!-- Print chart (horizontal bar rows) -->
          <div class="print-bar-chart" id="topChartPrint"></div>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card h-100">
        <div class="card-header"><span>Top Seller Highlight</span></div>
        <div class="card-body" id="highlight"></div>
      </div>
    </div>
  </div>

  <div class="card mt-3">
    <div class="card-header"><span>Full Ranking</span></div>
    <div class="table-responsive">
      <table class="table table-hover" style="table-layout:fixed;width:100%;min-width:0;">
        <colgroup>
          <col style="width:60px;">
          <col style="width:35%;">
          <col style="width:10%;">
          <col style="width:18%;">
          <col style="width:22%;">
          <col style="width:10%;">
        </colgroup>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Item</th>
            <th class="text-center">Qty</th>
            <th class="text-end">Revenue</th>
            <th class="text-end">Share</th>
            <th class="text-center">Orders</th>
          </tr>
        </thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/helpers.js"></script>
<script src="../assets/js/components.js"></script>
<script>
/* Set print date */
document.querySelectorAll('.print-date').forEach(function(el) {
  el.textContent = new Date().toLocaleString('en-US', {
    month: 'short', day: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
});

function renderBest() {
  const map = {};
  DB.orders
    .filter(o => o.status !== 'cancelled' && o.status !== 'hold')
    .forEach(function(o) {
      o.items.forEach(function(it) {
        if (!map[it.name]) map[it.name] = { qty: 0, rev: 0, orders: 0 };
        map[it.name].qty    += it.qty;
        map[it.name].rev    += it.qty * it.price;
        map[it.name].orders++;
      });
    });

  const items    = Object.keys(map).map(k => ({ name: k, ...map[k] })).sort((a, b) => b.qty - a.qty);
  const totalRev = items.reduce((s, i) => s + i.rev, 0);
  const top10    = items.slice(0, 10);
  const maxQty   = top10.length ? top10[0].qty : 1;

  /* ── Screen bar chart ── */
  barChart('topChart', top10.map(function(i) {
    return {
      label: i.name.split(' ')[0],
      bars: [{ h: Math.round((i.qty / maxQty) * 100), title: i.name + ': ' + i.qty + ' sold · ' + formatPKR(i.rev) }]
    };
  }));

  /* ── Print horizontal bar chart ── */
  const printChart = document.getElementById('topChartPrint');
  if (printChart) {
    printChart.innerHTML = top10.map(function(i) {
      const pct = Math.round((i.qty / maxQty) * 100);
      return '<div class="pbc-row">' +
        '<div class="pbc-label" title="' + esc(i.name) + '">' + esc(i.name.split(' (')[0]) + '</div>' +
        '<div class="pbc-track"><div class="pbc-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="pbc-val">' + i.qty + '</div>' +
        '</div>';
    }).join('');
  }

  /* ── Highlight card ── */
  const highlightEl = document.getElementById('highlight');
  if (!items.length) {
    highlightEl.innerHTML = '<div class="empty-state"><div class="es-icon"><i class="fa-regular fa-folder-open"></i></div><h6>No sales yet</h6><p>Completed orders will appear here.</p></div>';
    document.getElementById('rankBody').innerHTML = emptyRow(6, 'No sales yet', 'Completed orders will appear here.');
    return;
  }

  const champ = items[0];
  const champShare = Math.round((champ.rev / totalRev) * 100);
  highlightEl.innerHTML =
    '<div class="text-center py-2">' +
    '<div class="rank-chip top" style="width:52px;height:52px;font-size:20px;border-radius:14px;margin:0 auto 12px;">' +
      '<i class="fa-solid fa-trophy"></i>' +
    '</div>' +
    '<h5 class="fw-bold mb-1" style="font-size:16px;">' + esc(champ.name) + '</h5>' +
    '<p class="text-secondary mb-3" style="font-size:12.5px;">Top seller by volume</p>' +
    '<div class="row g-2 text-center">' +
      '<div class="col-4"><div class="stat-box stat-box-inner">' +
        '<div class="sv" style="font-size:18px;">' + champ.qty + '</div>' +
        '<div class="sl">SOLD</div>' +
      '</div></div>' +
      '<div class="col-4"><div class="stat-box stat-box-inner">' +
        '<div class="sv" style="font-size:14px;">' + formatPKR(champ.rev) + '</div>' +
        '<div class="sl">REVENUE</div>' +
      '</div></div>' +
      '<div class="col-4"><div class="stat-box stat-box-inner">' +
        '<div class="sv" style="font-size:18px;">' + champShare + '%</div>' +
        '<div class="sl">SHARE</div>' +
      '</div></div>' +
    '</div></div>';

  /* ── Full ranking table ── */
  const body = document.getElementById('rankBody');
  body.innerHTML = items.map(function(i, idx) {
    const share = Math.round((i.rev / totalRev) * 100);
    const isTop = idx < 3;
    return '<tr>' +
      '<td><span class="rank-chip' + (isTop ? ' top' : '') + '">' + (idx + 1) + '</span></td>' +
      '<td class="cell-fw" style="white-space:normal;word-break:break-word;">' + esc(i.name) + '</td>' +
      '<td class="text-center">' + i.qty + '</td>' +
      '<td class="text-end cell-fw">' + formatPKR(i.rev) + '</td>' +
      '<td class="text-end">' +
        '<div class="d-flex align-items-center justify-content-end gap-2">' +
          '<div class="progress" style="width:60px;flex-shrink:0;">' +
            '<div class="progress-bar" style="width:' + share + '%;-webkit-print-color-adjust:exact;print-color-adjust:exact;"></div>' +
          '</div>' +
          '<b style="min-width:28px;">' + share + '%</b>' +
        '</div>' +
      '</td>' +
      '<td class="text-center">' + i.orders + '</td>' +
      '</tr>';
  }).join('');
}

document.addEventListener('DOMContentLoaded', renderBest);
</script>
</body>
</html>
