<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes — BiteFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="recipes">

<main class="main-content">

  <div class="page-head">
    <div>
      <h4 style="font-weight:800;margin-bottom:2px;">Recipes</h4>
      <span class="text-secondary" style="font-size:13px;">Standardised recipes — ingredients per batch, cost and margin.</span>
    </div>
    <div class="actions">
      <button class="btn btn-brand" onclick="openRecipeModal()"><i class="fa-solid fa-plus me-1"></i>Add Recipe</button>
    </div>
  </div>

  <div class="card">
    <div class="filter-bar">
      <div class="search-box" style="flex:1;min-width:200px;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="recipeSearch" placeholder="Search recipes..." style="width:100%;">
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Recipe</th>
            <th class="text-center">Output</th>
            <th class="text-end">Selling Price</th>
            <th class="text-end">Ingredient Cost</th>
            <th class="text-end">Margin</th>
            <th>Ingredients</th>
            <th class="text-end" style="width:130px;">Actions</th>
          </tr>
        </thead>
        <tbody id="recipeBody"></tbody>
      </table>
    </div>
  </div>

</main>

<!-- Recipe modal -->
<div class="modal fade" id="recipeModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="recipeModalTitle">Add Recipe</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-7">
            <label class="form-label">Recipe Name</label>
            <input type="text" id="rName" class="form-control" placeholder="e.g. Zinger Burger">
          </div>
          <div class="col-5">
            <label class="form-label">Output (servings / batch)</label>
            <input type="number" id="rOutput" class="form-control" value="1" min="1">
          </div>
          <div class="col-6">
            <label class="form-label">Selling Price (Rs)</label>
            <input type="number" id="rPrice" class="form-control" min="0" placeholder="e.g. 450">
          </div>
          <div class="col-6">
            <label class="form-label">Ingredient Cost (Rs)</label>
            <input type="number" id="rCost" class="form-control" min="0" placeholder="e.g. 280">
          </div>
          <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label mb-0">Ingredients</label>
              <button type="button" class="btn btn-ghost btn-sm" onclick="addIngRow()"><i class="fa-solid fa-plus me-1"></i>Add Ingredient</button>
            </div>
            <div id="rIngs"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-brand" id="recipeSave"><i class="fa-solid fa-floppy-disk me-1"></i>Save Recipe</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content text-center p-2">
      <div class="modal-body">
        <div class="es-icon" style="width:58px;height:58px;background:var(--danger-soft);color:var(--danger-dark);margin:0 auto 12px;">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h6 class="fw-bold" id="confirmMsg">Are you sure?</h6>
        <div class="d-flex gap-2 mt-3 justify-content-center">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmYesBtn">Yes, continue</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/helpers.js"></script>
<script src="../assets/js/components.js"></script>
<script>
let editingRecipe = null;

function renderRecipes() {
  const q = (document.getElementById('recipeSearch').value || '').toLowerCase();
  const list = DB.recipes.filter(r => !q || r.name.toLowerCase().includes(q));
  const el = document.getElementById('recipeBody');
  if (!list.length) {
    el.innerHTML = emptyRow(7, 'No recipes found', 'Add a recipe to track ingredient costs.');
    return;
  }
  el.innerHTML = list.map(function (r) {
    const margin = r.price ? Math.round(((r.price - r.cost) / r.price) * 100) : 0;
    const ingText = r.ingredients.map(ing => ing[0] + ' ' + ing[1] + ' ' + ing[2]).join(', ');
    return '<tr>' +
      '<td class="cell-fw">' + esc(r.name) + '</td>' +
      '<td class="text-center">' + r.output + '</td>' +
      '<td class="text-end">' + formatPKR(r.price) + '</td>' +
      '<td class="text-end">' + formatPKR(r.cost) + '</td>' +
      '<td class="text-end"><span class="fw-bold ' + (margin >= 40 ? 'text-success' : 'text-danger') + '">' + margin + '%</span></td>' +
      '<td style="font-size:12px;max-width:280px;color:var(--text-muted);">' + esc(ingText) + '</td>' +
      '<td class="text-end"><div class="d-inline-flex gap-1">' +
      '<button class="btn btn-ghost btn-sm" onclick="openRecipeModal(' + r.id + ')"><i class="fa-regular fa-pen-to-square"></i></button>' +
      '<button class="btn btn-ghost btn-sm" onclick="delRecipe(' + r.id + ')"><i class="fa-solid fa-trash"></i></button>' +
      '</div></td></tr>';
  }).join('');
}

function addIngRow(ing) {
  const el = document.getElementById('rIngs');
  const row = document.createElement('div');
  row.className = 'ingredient-row';
  row.innerHTML =
    '<select class="form-select form-select-sm r-ing" style="flex:1.4;">' +
    DB.ingredients.map(i => '<option' + (ing && ing[0] === i.name ? ' selected' : '') + '>' + esc(i.name) + '</option>').join('') + '</select>' +
    '<input type="number" class="form-control form-control-sm r-qty" placeholder="Qty" step="0.01" min="0" value="' + (ing ? ing[1] : '') + '">' +
    '<input type="text" class="form-control form-control-sm r-unit" placeholder="Unit" value="' + (ing ? esc(ing[2]) : '') + '">' +
    '<button type="button" class="btn btn-ghost btn-sm" onclick="this.parentElement.remove()"><i class="fa-solid fa-trash"></i></button>';
  el.appendChild(row);
}

function openRecipeModal(id) {
  editingRecipe = id ? DB.recipes.find(r => r.id === id) : null;
  document.getElementById('recipeModalTitle').textContent = editingRecipe ? 'Edit Recipe' : 'Add Recipe';
  document.getElementById('rName').value = editingRecipe ? editingRecipe.name : '';
  document.getElementById('rOutput').value = editingRecipe ? editingRecipe.output : 1;
  document.getElementById('rPrice').value = editingRecipe ? editingRecipe.price : '';
  document.getElementById('rCost').value = editingRecipe ? editingRecipe.cost : '';
  document.getElementById('rIngs').innerHTML = '';
  if (editingRecipe) {
    editingRecipe.ingredients.forEach(ing => addIngRow(ing));
  }
  bootstrap.Modal.getOrCreateInstance(document.getElementById('recipeModal')).show();
}

document.getElementById('recipeSave').addEventListener('click', function () {
  const name = document.getElementById('rName').value.trim();
  if (!name) { showToast('Recipe name is required.', 'danger'); return; }
  const ingredients = Array.from(document.querySelectorAll('#rIngs .ingredient-row')).map(function (row) {
    return [row.querySelector('.r-ing').value, Number(row.querySelector('.r-qty').value) || 0, row.querySelector('.r-unit').value.trim()];
  }).filter(ing => ing[1] > 0);
  if (!ingredients.length) { showToast('Add at least one ingredient.', 'danger'); return; }
  const data = {
    name: name,
    output: Number(document.getElementById('rOutput').value) || 1,
    price: Number(document.getElementById('rPrice').value) || 0,
    cost: Number(document.getElementById('rCost').value) || 0,
    ingredients: ingredients
  };
  if (editingRecipe) {
    Object.assign(editingRecipe, data);
    showToast('Recipe updated.', 'success');
  } else {
    DB.recipes.push({ id: Math.max.apply(null, DB.recipes.map(r => r.id)) + 1, ...data });
    showToast('Recipe added.', 'success');
  }
  bootstrap.Modal.getInstance(document.getElementById('recipeModal')).hide();
  renderRecipes();
});

function delRecipe(id) {
  const r = DB.recipes.find(x => x.id === id);
  confirmAction('Delete recipe <b>' + esc(r.name) + '</b>?', function () {
    DB.recipes = DB.recipes.filter(x => x.id !== id);
    showToast('Recipe deleted.', 'success');
    renderRecipes();
  }, 'Delete');
}

document.getElementById('recipeSearch').addEventListener('keyup', renderRecipes);

document.addEventListener('DOMContentLoaded', renderRecipes);
</script>
</body>
</html>
