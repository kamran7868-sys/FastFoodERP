<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingredients — BiteFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="inventory-ingredients">

<main class="main-content">

  <div class="page-head">
    <div>
      <h4 style="font-weight:800;margin-bottom:2px;">Ingredients</h4>
      <span class="text-secondary" style="font-size:13px;">Raw materials used in recipes — with cost and suppliers.</span>
    </div>
    <div class="actions">
      <a href="inventory-stock.html" class="btn btn-ghost"><i class="fa-solid fa-arrows-rotate me-1"></i>Stock Movements</a>
      <button class="btn btn-brand" onclick="openIngModal()"><i class="fa-solid fa-plus me-1"></i>Add Ingredient</button>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent blue"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-blue-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-boxes-stacked"></i></div>
          <div><div class="kpi-label">Ingredients</div><div class="kpi-value" style="font-size:20px;" id="ingCount">0</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent green"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-green-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-coins"></i></div>
          <div><div class="kpi-label">Stock Value</div><div class="kpi-value" style="font-size:20px;" id="ingValue">Rs 0</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent amber"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-amber-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-triangle-exclamation"></i></div>
          <div><div class="kpi-label">Low Stock</div><div class="kpi-value" style="font-size:20px;" id="ingLow">0</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent red"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-red-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-circle-xmark"></i></div>
          <div><div class="kpi-label">Out of Stock</div><div class="kpi-value" style="font-size:20px;" id="ingOut">0</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="filter-bar">
      <div class="search-box" style="flex:1;min-width:200px;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="ingSearch" placeholder="Search ingredients..." style="width:100%;">
      </div>
      <div class="filter-group">
        <select class="form-select form-select-sm" id="ingCat" style="width:auto;"><option value="All">All Categories</option></select>
        <select class="form-select form-select-sm" id="ingLevel" style="width:auto;">
          <option value="All">All Levels</option>
          <option value="ok">In Stock</option>
          <option value="low">Low</option>
          <option value="out">Out</option>
        </select>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Ingredient</th>
            <th>Category</th>
            <th class="text-center">Stock</th>
            <th class="text-center">Min Level</th>
            <th class="text-end">Cost</th>
            <th>Supplier</th>
            <th style="width:110px;">Status</th>
            <th class="text-end" style="width:130px;">Actions</th>
          </tr>
        </thead>
        <tbody id="ingBody"></tbody>
      </table>
    </div>
  </div>

</main>

<!-- Ingredient modal -->
<div class="modal fade" id="ingModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="ingModalTitle">Add Ingredient</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Name</label>
            <input type="text" id="gName" class="form-control" placeholder="e.g. Chicken Boneless">
          </div>
          <div class="col-6">
            <label class="form-label">Category</label>
            <select id="gCat" class="form-select"></select>
          </div>
          <div class="col-6">
            <label class="form-label">Unit</label>
            <select id="gUnit" class="form-select">
              <option>kg</option><option>gram</option><option>litre</option>
              <option>pack</option><option>crate</option><option>piece</option>
            </select>
          </div>
          <div class="col-4">
            <label class="form-label">Qty</label>
            <input type="number" id="gQty" class="form-control" min="0" value="0">
          </div>
          <div class="col-4">
            <label class="form-label">Min Level</label>
            <input type="number" id="gMin" class="form-control" min="0" value="5">
          </div>
          <div class="col-4">
            <label class="form-label">Cost / unit</label>
            <input type="number" id="gCost" class="form-control" min="0" value="100">
          </div>
          <div class="col-12">
            <label class="form-label">Supplier</label>
            <select id="gSupplier" class="form-select"></select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-brand" id="ingSave"><i class="fa-solid fa-floppy-disk me-1"></i>Save Ingredient</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content text-center p-2">
      <div class="modal-body">
        <div class="es-icon" style="width:58px;height:58px;background:var(--danger-soft);color:var(--danger-dark);margin:0 auto 12px;">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h6 class="fw-bold" id="confirmMsg">Are you sure?</h6>
        <div class="d-flex gap-2 mt-3 justify-content-center">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmYesBtn">Yes, continue</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/helpers.js"></script>
<script src="../assets/js/components.js"></script>
<script>
let editingIng = null;

function fillIngSelects() {
  document.getElementById('gCat').innerHTML = ['Meat', 'Produce', 'Dairy', 'Bakery', 'Pantry', 'Beverages', 'Packaging']
    .map(c => '<option>' + c + '</option>').join('');
  document.getElementById('ingCat').innerHTML = '<option value="All">All Categories</option>' +
    [...new Set(DB.ingredients.map(i => i.category))].map(c => '<option>' + esc(c) + '</option>').join('');
  document.getElementById('gSupplier').innerHTML = DB.suppliers.filter(s => s.status === 'active')
    .map(s => '<option>' + esc(s.name) + '</option>').join('');
}

function ingLevel(i) {
  if (i.qty <= 0) return 'out_of_stock';
  if (i.qty <= i.minQty) return 'low';
  return 'available';
}

function renderIngStats() {
  document.getElementById('ingCount').textContent = DB.ingredients.length;
  document.getElementById('ingValue').textContent = formatPKR(DB.ingredients.reduce((s, i) => s + i.qty * i.cost, 0));
  document.getElementById('ingLow').textContent = DB.ingredients.filter(i => i.qty > 0 && i.qty <= i.minQty).length;
  document.getElementById('ingOut').textContent = DB.ingredients.filter(i => i.qty <= 0).length;
}

function renderIngredients() {
  const q = (document.getElementById('ingSearch').value || '').toLowerCase();
  const cat = document.getElementById('ingCat').value;
  const lvl = document.getElementById('ingLevel').value;
  const list = DB.ingredients.filter(function (i) {
    const okQ = !q || i.name.toLowerCase().includes(q) || (i.supplier || '').toLowerCase().includes(q);
    const okC = cat === 'All' || i.category === cat;
    const l = ingLevel(i);
    const okL = lvl === 'All' || (lvl === 'ok' ? l === 'available' : l === lvl);
    return okQ && okC && okL;
  });
  const el = document.getElementById('ingBody');
  if (!list.length) {
    el.innerHTML = emptyRow(8, 'No ingredients found', 'Try changing filters.');
    return;
  }
  el.innerHTML = list.map(function (i) {
    const lvl = ingLevel(i);
    const pct = lvl === 'out_of_stock' ? 0 : Math.min(100, Math.round((i.qty / Math.max(i.minQty, 1)) * 100));
    return '<tr>' +
      '<td class="cell-fw">' + esc(i.name) + '</td>' +
      '<td>' + esc(i.category) + '</td>' +
      '<td class="text-center"><b>' + i.qty + '</b> ' + esc(i.unit) + '</td>' +
      '<td class="text-center text-secondary">' + i.minQty + ' ' + esc(i.unit) + '</td>' +
      '<td class="text-end">' + formatPKR(i.cost) + '</td>' +
      '<td style="font-size:12.5px;">' + esc(i.supplier || '—') + '</td>' +
      '<td style="min-width:110px;"><div class="d-flex align-items-center gap-2">' + statusBadge(lvl) +
      '<div class="progress flex-grow-1" style="width:50px;"><div class="progress-bar ' + (lvl === 'available' ? '' : 'bg-danger') + '" style="width:' + pct + '%"></div></div></div></td>' +
      '<td class="text-end"><div class="d-inline-flex gap-1">' +
      '<button class="btn btn-ghost btn-sm" onclick="openIngModal(' + i.id + ')"><i class="fa-regular fa-pen-to-square"></i></button>' +
      '<button class="btn btn-ghost btn-sm" onclick="delIng(' + i.id + ')"><i class="fa-solid fa-trash"></i></button>' +
      '</div></td></tr>';
  }).join('');
}

function openIngModal(id) {
  editingIng = id ? DB.ingredients.find(i => i.id === id) : null;
  document.getElementById('ingModalTitle').textContent = editingIng ? 'Edit Ingredient' : 'Add Ingredient';
  document.getElementById('gName').value = editingIng ? editingIng.name : '';
  document.getElementById('gCat').value = editingIng ? editingIng.category : 'Meat';
  document.getElementById('gUnit').value = editingIng ? editingIng.unit : 'kg';
  document.getElementById('gQty').value = editingIng ? editingIng.qty : 0;
  document.getElementById('gMin').value = editingIng ? editingIng.minQty : 5;
  document.getElementById('gCost').value = editingIng ? editingIng.cost : 100;
  document.getElementById('gSupplier').value = editingIng ? editingIng.supplier : DB.suppliers[0].name;
  bootstrap.Modal.getOrCreateInstance(document.getElementById('ingModal')).show();
}

document.getElementById('ingSave').addEventListener('click', function () {
  const name = document.getElementById('gName').value.trim();
  if (!name) { showToast('Ingredient name is required.', 'danger'); return; }
  const data = {
    name: name,
    category: document.getElementById('gCat').value,
    unit: document.getElementById('gUnit').value,
    qty: Number(document.getElementById('gQty').value) || 0,
    minQty: Number(document.getElementById('gMin').value) || 0,
    cost: Number(document.getElementById('gCost').value) || 0,
    supplier: document.getElementById('gSupplier').value
  };
  if (editingIng) {
    Object.assign(editingIng, data);
    showToast('Ingredient updated.', 'success');
  } else {
    DB.ingredients.push({ id: Math.max.apply(null, DB.ingredients.map(i => i.id)) + 1, ...data });
    showToast('Ingredient added.', 'success');
  }
  bootstrap.Modal.getInstance(document.getElementById('ingModal')).hide();
  renderIngStats();
  renderIngredients();
});

function delIng(id) {
  const i = DB.ingredients.find(x => x.id === id);
  confirmAction('Delete ingredient <b>' + esc(i.name) + '</b>?', function () {
    DB.ingredients = DB.ingredients.filter(x => x.id !== id);
    showToast('Ingredient deleted.', 'success');
    renderIngStats();
    renderIngredients();
  }, 'Delete');
}

document.getElementById('ingSearch').addEventListener('keyup', renderIngredients);
document.getElementById('ingCat').addEventListener('change', renderIngredients);
document.getElementById('ingLevel').addEventListener('change', renderIngredients);

document.addEventListener('DOMContentLoaded', function () {
  fillIngSelects();
  renderIngStats();
  renderIngredients();
});
</script>
</body>
</html>
