<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses — BiteFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="expenses">

<main class="main-content">

  <div class="page-head">
    <div>
      <h4 style="font-weight:800;margin-bottom:2px;">Expenses</h4>
      <span class="text-secondary" style="font-size:13px;">Rent, utilities, supplies and every other cost of running the café.</span>
    </div>
    <div class="actions">
      <button class="btn btn-brand" onclick="openExpModal()"><i class="fa-solid fa-plus me-1"></i>Add Expense</button>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent red"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-red-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-coins"></i></div>
          <div><div class="kpi-label">This Month</div><div class="kpi-value" style="font-size:20px;" id="exMonth">Rs 0</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent violet"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-violet-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-chart-pie"></i></div>
          <div><div class="kpi-label">Top Category</div><div class="kpi-value" style="font-size:20px;" id="exTop">—</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent blue"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-blue-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-file-invoice"></i></div>
          <div><div class="kpi-label">Entries</div><div class="kpi-value" style="font-size:20px;" id="exCount">0</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent green"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-green-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-building-shield"></i></div>
          <div><div class="kpi-label">Non-Rent</div><div class="kpi-value" style="font-size:20px;" id="exNonRent">Rs 0</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="filter-bar">
      <div class="search-box" style="flex:1;min-width:200px;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="expSearch" placeholder="Search description..." style="width:100%;">
      </div>
      <div class="filter-group">
        <select class="form-select form-select-sm" id="expCat" style="width:auto;"><option value="All">All Categories</option></select>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Description</th>
            <th>Method</th>
            <th class="text-end">Amount</th>
            <th class="text-end" style="width:130px;">Actions</th>
          </tr>
        </thead>
        <tbody id="expBody"></tbody>
      </table>
    </div>
  </div>

</main>

<!-- Expense modal -->
<div class="modal fade" id="expModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="expModalTitle">Add Expense</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label">Category</label>
        <select id="eCat" class="form-select mb-3"></select>
        <label class="form-label">Description</label>
        <input type="text" id="eDesc" class="form-control mb-3" placeholder="e.g. Shop rent (August)">
        <label class="form-label">Amount (Rs)</label>
        <input type="number" id="eAmt" class="form-control mb-3" min="0" placeholder="e.g. 12500">
        <label class="form-label">Payment Method</label>
        <select id="eMethod" class="form-select mb-3">
          <option>Cash</option><option>Card</option><option>Bank Transfer</option><option>JazzCash</option><option>EasyPaisa</option>
        </select>
        <label class="form-label">Date</label>
        <input type="text" id="eDate" class="form-control" readonly>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-brand" id="expSave"><i class="fa-solid fa-floppy-disk me-1"></i>Save Expense</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content text-center p-2">
      <div class="modal-body">
        <div class="es-icon" style="width:58px;height:58px;background:var(--danger-soft);color:var(--danger-dark);margin:0 auto 12px;">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h6 class="fw-bold" id="confirmMsg">Are you sure?</h6>
        <div class="d-flex gap-2 mt-3 justify-content-center">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmYesBtn">Yes, continue</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/helpers.js"></script>
<script src="../assets/js/components.js"></script>
<script>
let editingExp = null;

function renderExpStats() {
  const total = DB.expenses.reduce((s, e) => s + e.amount, 0);
  document.getElementById('exCount').textContent = DB.expenses.length;
  document.getElementById('exMonth').textContent = formatPKR(total);
  document.getElementById('exNonRent').textContent = formatPKR(DB.expenses.filter(e => e.category !== 'Rent').reduce((s, e) => s + e.amount, 0));
  const byCat = {};
  DB.expenses.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
  let top = '—', topAmt = 0;
  Object.keys(byCat).forEach(function (k) { if (byCat[k] > topAmt) { top = k; topAmt = byCat[k]; } });
  document.getElementById('exTop').textContent = top;
  document.getElementById('exTop').parentElement.style.fontSize = '16px';
}

function renderExpenses() {
  const q = (document.getElementById('expSearch').value || '').toLowerCase();
  const cat = document.getElementById('expCat').value;
  const list = DB.expenses.filter(function (e) {
    const okQ = !q || e.description.toLowerCase().includes(q);
    const okC = cat === 'All' || e.category === cat;
    return okQ && okC;
  }).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id));
  const el = document.getElementById('expBody');
  if (!list.length) {
    el.innerHTML = emptyRow(6, 'No expenses found', 'Add an expense to track costs.');
    return;
  }
  el.innerHTML = list.map(function (e) {
    return '<tr>' +
      '<td style="font-size:12.5px;">' + esc(e.date) + '</td>' +
      '<td><span class="badge badge-pending">' + esc(e.category) + '</span></td>' +
      '<td>' + esc(e.description) + '</td>' +
      '<td style="font-size:12.5px;">' + esc(e.method) + '</td>' +
      '<td class="text-end cell-fw">' + formatPKR(e.amount) + '</td>' +
      '<td class="text-end"><div class="d-inline-flex gap-1">' +
      '<button class="btn btn-ghost btn-sm" onclick="openExpModal(' + e.id + ')"><i class="fa-regular fa-pen-to-square"></i></button>' +
      '<button class="btn btn-ghost btn-sm" onclick="delExp(' + e.id + ')"><i class="fa-solid fa-trash"></i></button>' +
      '</div></td></tr>';
  }).join('');
}

function openExpModal(id) {
  editingExp = id ? DB.expenses.find(e => e.id === id) : null;
  document.getElementById('expModalTitle').textContent = editingExp ? 'Edit Expense' : 'Add Expense';
  document.getElementById('eCat').innerHTML = DB.expenseCategories.map(c => '<option>' + esc(c) + '</option>').join('');
  document.getElementById('eCat').value = editingExp ? editingExp.category : 'Supplies';
  document.getElementById('eDesc').value = editingExp ? editingExp.description : '';
  document.getElementById('eAmt').value = editingExp ? editingExp.amount : '';
  document.getElementById('eMethod').value = editingExp ? editingExp.method : 'Cash';
  document.getElementById('eDate').value = editingExp ? editingExp.date : todayStr();
  bootstrap.Modal.getOrCreateInstance(document.getElementById('expModal')).show();
}

document.getElementById('expSave').addEventListener('click', function () {
  const desc = document.getElementById('eDesc').value.trim();
  const amt = Number(document.getElementById('eAmt').value) || 0;
  if (!desc) { showToast('Description is required.', 'danger'); return; }
  if (amt <= 0) { showToast('Amount must be greater than zero.', 'danger'); return; }
  const data = {
    date: document.getElementById('eDate').value,
    category: document.getElementById('eCat').value,
    description: desc,
    amount: amt,
    method: document.getElementById('eMethod').value
  };
  if (editingExp) {
    Object.assign(editingExp, data);
    showToast('Expense updated.', 'success');
  } else {
    DB.expenses.push({ id: Math.max.apply(null, DB.expenses.map(e => e.id)) + 1, ...data });
    showToast('Expense added.', 'success');
  }
  bootstrap.Modal.getInstance(document.getElementById('expModal')).hide();
  renderExpStats();
  renderExpenses();
});

function delExp(id) {
  const e = DB.expenses.find(x => x.id === id);
  confirmAction('Delete expense <b>' + esc(e.description) + '</b> (' + formatPKR(e.amount) + ')?', function () {
    DB.expenses = DB.expenses.filter(x => x.id !== id);
    showToast('Expense deleted.', 'success');
    renderExpStats();
    renderExpenses();
  }, 'Delete');
}

document.getElementById('expSearch').addEventListener('keyup', renderExpenses);
document.getElementById('expCat').addEventListener('change', renderExpenses);

document.addEventListener('DOMContentLoaded', function () {
  renderExpStats();
  renderExpenses();
});
</script>
</body>
</html>
