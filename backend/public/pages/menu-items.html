<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Items — BiteFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="menu-items">

<main class="main-content">

  <div class="page-head">
    <div>
      <h4 style="font-weight:800;margin-bottom:2px;">Menu Items</h4>
      <span class="text-secondary" style="font-size:13px;">All products sold at the counter — with sizes and prices.</span>
    </div>
    <div class="actions">
      <a href="menu-addons.html" class="btn btn-ghost"><i class="fa-solid fa-list-ul me-1"></i>Add-ons</a>
      <button class="btn btn-brand" onclick="openItemModal()"><i class="fa-solid fa-plus me-1"></i>Add Item</button>
    </div>
  </div>

  <div class="card">
    <div class="filter-bar">
      <div class="search-box" style="flex:1;min-width:200px;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="itemSearch" placeholder="Search items..." style="width:100%;">
      </div>
      <div class="filter-group">
        <select class="form-select form-select-sm" id="fCat" style="width:auto;"><option value="All">All Categories</option></select>
        <select class="form-select form-select-sm" id="fItemStatus" style="width:auto;">
          <option value="All">All Status</option>
          <option>Available</option>
          <option>Out of stock</option>
        </select>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th style="width:56px;"></th>
            <th>Item</th>
            <th>Category</th>
            <th>Variants / Prices</th>
            <th>Add-ons</th>
            <th style="width:110px;">Status</th>
            <th class="text-end" style="width:130px;">Actions</th>
          </tr>
        </thead>
        <tbody id="itemBody"></tbody>
      </table>
    </div>
  </div>

</main>

<!-- Item modal -->
<div class="modal fade" id="itemModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="itemModalTitle">Add Menu Item</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-6 col-md-2">
            <label class="form-label">Emoji</label>
            <input type="text" id="iEmoji" class="form-control" placeholder="🍔" maxlength="4">
          </div>
          <div class="col-6 col-md-4">
            <label class="form-label">Item Name</label>
            <input type="text" id="iName" class="form-control" placeholder="e.g. Zinger Burger">
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label">Category</label>
            <select id="iCat" class="form-select"></select>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label">Status</label>
            <select id="iStatus" class="form-select">
              <option value="available">Available</option>
              <option value="out_of_stock">Out of stock</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <input type="text" id="iDesc" class="form-control" placeholder="Short description for the counter">
          </div>
          <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label mb-0">Variants (sizes &amp; prices)</label>
              <button type="button" class="btn btn-ghost btn-sm" onclick="addVariantRow()"><i class="fa-solid fa-plus me-1"></i>Add Variant</button>
            </div>
            <div id="iVariants"></div>
          </div>
          <div class="col-12">
            <label class="form-label mb-2">Available Add-ons</label>
            <div class="d-flex flex-wrap gap-2" id="iAddons"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-brand" id="itemSave"><i class="fa-solid fa-floppy-disk me-1"></i>Save Item</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content text-center p-2">
      <div class="modal-body">
        <div class="es-icon" style="width:58px;height:58px;background:var(--danger-soft);color:var(--danger-dark);margin:0 auto 12px;">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h6 class="fw-bold" id="confirmMsg">Are you sure?</h6>
        <div class="d-flex gap-2 mt-3 justify-content-center">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="confirmYesBtn">Yes, continue</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/helpers.js"></script>
<script src="../assets/js/components.js"></script>
<script>
let editingItem = null;

function fillCatSelects() {
  const opts = DB.categories.map(c => '<option>' + esc(c.name) + '</option>').join('');
  document.getElementById('iCat').innerHTML = opts;
  document.getElementById('fCat').innerHTML = '<option value="All">All Categories</option>' + opts;
}

function renderItems() {
  const q = (document.getElementById('itemSearch').value || '').toLowerCase();
  const cat = document.getElementById('fCat').value;
  const st = document.getElementById('fItemStatus').value;
  const list = DB.menu.filter(function (m) {
    const okQ = !q || m.name.toLowerCase().includes(q) || m.category.toLowerCase().includes(q);
    const okC = cat === 'All' || m.category === cat;
    const okS = st === 'All' || m.status === st.toLowerCase().replace(/ /g, '_');
    return okQ && okC && okS;
  });
  const el = document.getElementById('itemBody');
  if (!list.length) {
    el.innerHTML = emptyRow(7, 'No menu items found', 'Try changing filters or add a new item.');
    return;
  }
  el.innerHTML = list.map(function (m) {
    const priceHtml = m.variants.map(v => '<div class="variant-pill"><span>' + esc(v.size) + '</span><b>' + formatPKR(v.price) + '</b></div>').join('');
    const addonHtml = m.addons.length
      ? m.addons.map(id => DB.addons.find(a => a.id === id).name).join(', ')
      : '<span class="text-secondary">—</span>';
    return '<tr>' +
      '<td><span class="rank-chip" style="font-size:19px;width:40px;height:40px;">' + esc(m.emoji || '🍽️') + '</span></td>' +
      '<td><div class="cell-fw">' + esc(m.name) + '</div><div class="text-secondary" style="font-size:12px;">' + esc(m.desc || '') + '</div></td>' +
      '<td>' + esc(m.category) + '</td>' +
      '<td><div class="d-flex flex-column gap-1">' + priceHtml + '</div></td>' +
      '<td style="font-size:12.5px;max-width:170px;">' + addonHtml + '</td>' +
      '<td>' + statusBadge(m.status) + '</td>' +
      '<td class="text-end"><div class="d-inline-flex gap-1">' +
      '<button class="btn btn-ghost btn-sm" onclick="openItemModal(' + m.id + ')"><i class="fa-regular fa-pen-to-square"></i></button>' +
      '<button class="btn btn-ghost btn-sm" onclick="delItem(' + m.id + ')"><i class="fa-solid fa-trash"></i></button>' +
      '</div></td></tr>';
  }).join('');
}

function addVariantRow(size, price, cost) {
  const el = document.getElementById('iVariants');
  const row = document.createElement('div');
  row.className = 'variant-row';
  row.innerHTML =
    '<input type="text" class="form-control form-control-sm v-size" placeholder="Size (e.g. Regular)" value="' + esc(size || '') + '">' +
    '<input type="number" class="form-control form-control-sm v-price" placeholder="Price (Rs)" value="' + (price || '') + '">' +
    '<input type="number" class="form-control form-control-sm v-cost" placeholder="Cost (Rs)" value="' + (cost || '') + '">' +
    '<button type="button" class="btn btn-ghost btn-sm" onclick="this.parentElement.remove()"><i class="fa-solid fa-trash"></i></button>';
  el.appendChild(row);
}

function openItemModal(id) {
  editingItem = id ? DB.menu.find(m => m.id === id) : null;
  document.getElementById('itemModalTitle').textContent = editingItem ? 'Edit Menu Item' : 'Add Menu Item';
  document.getElementById('iEmoji').value = editingItem ? (editingItem.emoji || '') : '';
  document.getElementById('iName').value = editingItem ? editingItem.name : '';
  document.getElementById('iCat').value = editingItem ? editingItem.category : DB.categories[0].name;
  document.getElementById('iStatus').value = editingItem ? editingItem.status : 'available';
  document.getElementById('iDesc').value = editingItem ? (editingItem.desc || '') : '';

  document.getElementById('iVariants').innerHTML = '';
  if (editingItem) {
    editingItem.variants.forEach(v => addVariantRow(v.size, v.price, v.cost));
  } else {
    addVariantRow('Regular', '', '');
  }

  const addonsEl = document.getElementById('iAddons');
  addonsEl.innerHTML = DB.addons.map(function (a) {
    const checked = editingItem && editingItem.addons.includes(a.id);
    return '<label class="addon-chip' + (checked ? ' active' : '') + '" style="cursor:pointer;">' +
      '<input type="checkbox" value="' + a.id + '"' + (checked ? ' checked' : '') + ' class="form-check-input me-1" style="display:none;">' +
      esc(a.name) + ' (+' + formatPKR(a.price) + ')</label>';
  }).join('');
  addonsEl.querySelectorAll('input[type=checkbox]').forEach(function (c) {
    c.addEventListener('change', function () { c.closest('label').classList.toggle('active', c.checked); });
  });

  bootstrap.Modal.getOrCreateInstance(document.getElementById('itemModal')).show();
}

document.getElementById('itemSave').addEventListener('click', function () {
  const name = document.getElementById('iName').value.trim();
  if (!name) { showToast('Item name is required.', 'danger'); return; }
  const variants = Array.from(document.querySelectorAll('#iVariants .variant-row')).map(function (row) {
    return {
      size: row.querySelector('.v-size').value.trim() || 'Regular',
      price: Number(row.querySelector('.v-price').value) || 0,
      cost: Number(row.querySelector('.v-cost').value) || 0
    };
  }).filter(v => v.price > 0);
  if (!variants.length) { showToast('Add at least one variant with a price.', 'danger'); return; }
  const addons = Array.from(document.querySelectorAll('#iAddons input:checked')).map(c => Number(c.value));

  if (editingItem) {
    editingItem.name = name;
    editingItem.emoji = document.getElementById('iEmoji').value.trim() || editingItem.emoji;
    editingItem.category = document.getElementById('iCat').value;
    editingItem.status = document.getElementById('iStatus').value;
    editingItem.desc = document.getElementById('iDesc').value.trim();
    editingItem.variants = variants;
    editingItem.addons = addons;
    editingItem.baseCost = Math.min.apply(null, variants.map(v => v.cost)) || editingItem.baseCost;
    showToast('Menu item updated.', 'success');
  } else {
    DB.menu.push({
      id: Math.max.apply(null, DB.menu.map(m => m.id)) + 1,
      name: name,
      emoji: document.getElementById('iEmoji').value.trim() || '🍽️',
      category: document.getElementById('iCat').value,
      status: document.getElementById('iStatus').value,
      desc: document.getElementById('iDesc').value.trim(),
      baseCost: Math.min.apply(null, variants.map(v => v.cost)) || 0,
      variants: variants,
      addons: addons
    });
    showToast('Menu item added.', 'success');
  }
  bootstrap.Modal.getInstance(document.getElementById('itemModal')).hide();
  renderItems();
});

function delItem(id) {
  const m = DB.menu.find(x => x.id === id);
  confirmAction('Delete <b>' + esc(m.name) + '</b> from the menu?', function () {
    DB.menu = DB.menu.filter(x => x.id !== id);
    showToast('Menu item deleted.', 'success');
    renderItems();
  }, 'Delete');
}

document.getElementById('itemSearch').addEventListener('keyup', renderItems);
document.getElementById('fCat').addEventListener('change', renderItems);
document.getElementById('fItemStatus').addEventListener('change', renderItems);

document.addEventListener('DOMContentLoaded', function () {
  fillCatSelects();
  renderItems();
});
</script>
</body>
</html>
