<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Settings — BiteFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="settings-business">

<main class="main-content">

  <div class="page-head">
    <div>
      <h4 style="font-weight:800;margin-bottom:2px;">Business Settings</h4>
      <span class="text-secondary" style="font-size:13px;">Café profile, tax rate and invoice footer.</span>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-7">
      <div class="card">
        <div class="card-header"><span><i class="fa-solid fa-shop me-1"></i> Business Profile</span></div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Business Name</label>
              <input type="text" id="bName" class="form-control" placeholder="Business name">
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" id="bPhone" class="form-control" placeholder="e.g. 0300-1234567">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" id="bEmail" class="form-control" placeholder="e.g. info@business.pk">
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              <input type="text" id="bAddr" class="form-control" placeholder="Shop address">
            </div>
            <div class="col-md-4">
              <label class="form-label">Currency</label>
              <select id="bCurr" class="form-select">
                <option value="PKR (Rs)">PKR (Rs)</option>
                <option value="USD ($)">USD ($)</option>
                <option value="AED (Dh)">AED (Dh)</option>
                <option value="SAR (SR)">SAR (SR)</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Tax Rate (%)</label>
              <input type="number" id="bTax" class="form-control" min="0" max="25" step="0.5">
            </div>
            <div class="col-md-4">
              <label class="form-label">Invoice Prefix</label>
              <input type="text" id="bPrefix" class="form-control" placeholder="e.g. INV">
            </div>
            <div class="col-12">
              <label class="form-label">Invoice Footer Message</label>
              <textarea id="bFooter" class="form-control" rows="2" placeholder="Thank you message on printed invoices"></textarea>
            </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-brand" id="saveBusiness"><i class="fa-solid fa-floppy-disk me-1"></i>Save Settings</button>
            <button class="btn btn-ghost" onclick="loadBusiness()"><i class="fa-solid fa-rotate-left me-1"></i>Reset</button>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card mb-3">
        <div class="card-header"><span>Invoice Preview</span></div>
        <div class="card-body">
          <div class="bill-preview" id="invPreview"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span><i class="fa-solid fa-circle-info me-1"></i> About</span></div>
        <div class="card-body" style="font-size:13px;">
          <div class="d-flex justify-content-between py-1"><span class="text-secondary">System</span><b>BiteFlow</b></div>
          <div class="d-flex justify-content-between py-1"><span class="text-secondary">Version</span><b>v2.0</b></div>
          <div class="d-flex justify-content-between py-1"><span class="text-secondary">Module</span><b>Frontend (demo data)</b></div>
          <div class="d-flex justify-content-between py-1"><span class="text-secondary">Demo date</span><b>09 Aug 2024</b></div>
          <hr>
          <div class="alert alert-danger mb-0" style="background:var(--danger-soft);border:none;color:var(--danger-dark);font-size:12.5px;">
            <i class="fa-solid fa-triangle-exclamation me-1"></i>Data is stored in the browser only and resets on refresh. Backend integration (Laravel + MySQL) is on hold.
          </div>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/helpers.js"></script>
<script src="../assets/js/components.js"></script>
<script>
function loadBusiness() {
  const b = DB.business;
  document.getElementById('bName').value = b.name;
  document.getElementById('bPhone').value = b.phone;
  document.getElementById('bEmail').value = b.email || '';
  document.getElementById('bAddr').value = b.address;
  document.getElementById('bCurr').value = b.currency;
  document.getElementById('bTax').value = b.taxRate;
  document.getElementById('bPrefix').value = 'INV';
  document.getElementById('bFooter').value = b.invoiceFooter;
  renderPreview();
}

function renderPreview() {
  const b = DB.business;
  document.getElementById('invPreview').innerHTML =
    '<div class="text-center mb-2"><b style="font-size:14px;">' + esc(b.name) + '</b><br>' +
    '<small>' + esc(b.address) + ' — ' + esc(b.phone) + '</small></div>' +
    '<div class="bill-row"><span>Invoice #' + bPrefix() + '-1015</span><span>' + todayStr() + '</span></div>' +
    '<div class="bill-row"><span>Zinger Burger × 2</span><span>' + formatPKR(900) + '</span></div>' +
    '<div class="bill-row"><span>Cold Coffee × 1</span><span>' + formatPKR(280) + '</span></div>' +
    '<div class="bill-row"><span>Subtotal</span><span>' + formatPKR(1180) + '</span></div>' +
    '<div class="bill-row"><span>Tax (' + b.taxRate + '%)</span><span>' + formatPKR(Math.round(1180 * b.taxRate / 100)) + '</span></div>' +
    '<div class="bill-row" style="font-weight:800;border-top:1px dashed var(--border);padding-top:6px;margin-top:4px;"><span>TOTAL</span><span>' + formatPKR(Math.round(1180 * (1 + b.taxRate / 100))) + '</span></div>' +
    '<div class="text-center mt-2"><small>' + esc(b.invoiceFooter) + '</small></div>';
}

function bPrefix() {
  const p = document.getElementById('bPrefix').value.trim();
  return p || 'INV';
}

document.getElementById('saveBusiness').addEventListener('click', function () {
  const b = DB.business;
  b.name = document.getElementById('bName').value.trim() || b.name;
  b.phone = document.getElementById('bPhone').value.trim() || b.phone;
  b.email = document.getElementById('bEmail').value.trim();
  b.address = document.getElementById('bAddr').value.trim() || b.address;
  b.currency = document.getElementById('bCurr').value;
  b.taxRate = Number(document.getElementById('bTax').value) || 0;
  b.invoiceFooter = document.getElementById('bFooter').value.trim() || b.invoiceFooter;
  showToast('Business settings saved.', 'success');
  renderPreview();
});

document.querySelectorAll('#bName, #bPhone, #bEmail, #bAddr, #bCurr, #bTax, #bPrefix, #bFooter').forEach(function (el) {
  el.addEventListener('input', renderPreview);
});

document.addEventListener('DOMContentLoaded', loadBusiness);
</script>
</body>
</html>
