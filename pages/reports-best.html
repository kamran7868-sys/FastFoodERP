<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Selling Items — BiteFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="reports-best" class="report-print">

<main class="main-content">

  <div class="print-report-head">
    <div class="prh-brand">BITEFLOW</div>
    <div class="prh-title">Best Selling Items</div>
    <div class="prh-meta">Generated: <span class="print-date">—</span></div>
  </div>

  <div class="page-head">
    <div>
      <h4 style="font-weight:800;margin-bottom:2px;">Best Selling Items</h4>
      <span class="text-secondary" style="font-size:13px;">Top products by quantity and revenue — across all orders.</span>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="window.print()"><i class="fa-solid fa-print me-1"></i>Print Report</button>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-7">
      <div class="card h-100">
        <div class="card-header"><span>Top 10 — Quantity Sold</span></div>
        <div class="card-body"><div class="bar-chart" id="topChart"></div></div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card h-100">
        <div class="card-header"><span>Highlight</span></div>
        <div class="card-body" id="highlight"></div>
      </div>
    </div>
  </div>

  <div class="card mt-3">
    <div class="card-header"><span>Full Ranking</span></div>
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr>
            <th style="width:60px;">Rank</th>
            <th>Item</th>
            <th class="text-center">Qty Sold</th>
            <th class="text-end">Revenue</th>
            <th class="text-end">Share of Sales</th>
            <th class="text-center">Orders</th>
          </tr>
        </thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/helpers.js"></script>
<script src="../assets/js/components.js"></script>
<script>
function renderBest() {
  const map = {};
  DB.orders.filter(o => o.status !== 'cancelled' && o.status !== 'hold').forEach(function (o) {
    o.items.forEach(function (it) {
      if (!map[it.name]) map[it.name] = { qty: 0, rev: 0, orders: 0 };
      map[it.name].qty += it.qty;
      map[it.name].rev += it.qty * it.price;
      map[it.name].orders++;
    });
  });
  const items = Object.keys(map).map(k => ({ name: k, ...map[k] })).sort((a, b) => b.qty - a.qty);
  const totalRev = items.reduce((s, i) => s + i.rev, 0);
  const top10 = items.slice(0, 10);
  const maxQty = top10.length ? top10[0].qty : 1;

  barChart('topChart', top10.map(function (i) {
    return { label: i.name.split(' ')[0], bars: [{ h: Math.round((i.qty / maxQty) * 100), title: i.name + ': ' + i.qty + ' sold · ' + formatPKR(i.rev) }] };
  }));

  const body = document.getElementById('rankBody');
  if (!items.length) {
    body.innerHTML = emptyRow(6, 'No sales yet', 'Completed orders will appear here.');
    document.getElementById('highlight').innerHTML = '';
    return;
  }

  const champ = items[0];
  document.getElementById('highlight').innerHTML =
    '<div class="text-center py-2">' +
    '<div class="rank-chip top" style="width:56px;height:56px;font-size:20px;border-radius:16px;margin-bottom:10px;"><i class="fa-solid fa-trophy"></i></div>' +
    '<h5 class="fw-bold mb-1">' + esc(champ.name) + '</h5>' +
    '<p class="text-secondary mb-3" style="font-size:13px;">Top seller by volume</p>' +
    '<div class="row g-2 text-center">' +
    '<div class="col-4"><div class="stat-box" style="background:var(--bg);border-radius:12px;"><div class="sv" style="font-size:18px;">' + champ.qty + '</div><div class="sl">Sold</div></div></div>' +
    '<div class="col-4"><div class="stat-box" style="background:var(--bg);border-radius:12px;"><div class="sv" style="font-size:18px;">' + formatPKR(champ.rev) + '</div><div class="sl">Revenue</div></div></div>' +
    '<div class="col-4"><div class="stat-box" style="background:var(--bg);border-radius:12px;"><div class="sv" style="font-size:18px;">' + Math.round((champ.rev / totalRev) * 100) + '%</div><div class="sl">Share</div></div></div>' +
    '</div></div>';

  body.innerHTML = items.map(function (i, idx) {
    const share = Math.round((i.rev / totalRev) * 100);
    return '<tr>' +
      '<td><span class="rank-chip' + (idx < 3 ? ' top' : '') + '">' + (idx + 1) + '</span></td>' +
      '<td class="cell-fw">' + esc(i.name) + '</td>' +
      '<td class="text-center">' + i.qty + '</td>' +
      '<td class="text-end cell-fw">' + formatPKR(i.rev) + '</td>' +
      '<td class="text-end"><div class="d-flex align-items-center justify-content-end gap-2"><div class="progress" style="width:70px;"><div class="progress-bar" style="width:' + share + '%"></div></div><b>' + share + '%</b></div></td>' +
      '<td class="text-center">' + i.orders + '</td></tr>';
  }).join('');
}

document.addEventListener('DOMContentLoaded', renderBest);
</script>
</body>
</html>
