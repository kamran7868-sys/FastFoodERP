<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profit Summary — BiteFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="reports-profit" class="report-print">

<main class="main-content">

  <div class="print-report-head">
    <div class="prh-brand">BITEFLOW</div>
    <div class="prh-title">Profit Summary</div>
    <div class="prh-meta">Generated: <span class="print-date">—</span></div>
  </div>

  <div class="page-head">
    <div>
      <h4 style="font-weight:800;margin-bottom:2px;">Profit Summary</h4>
      <span class="text-secondary" style="font-size:13px;">Revenue vs estimated food cost — gross profit at a glance.</span>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="window.print()"><i class="fa-solid fa-print me-1"></i>Print Report</button>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent green"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-green-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-sack-dollar"></i></div>
          <div><div class="kpi-label">Revenue</div><div class="kpi-value" style="font-size:20px;" id="pfRev">Rs 0</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent red"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-red-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-drumstick-bite"></i></div>
          <div><div class="kpi-label">Food Cost (est.)</div><div class="kpi-value" style="font-size:20px;" id="pfCost">Rs 0</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent violet"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-violet-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-piggy-bank"></i></div>
          <div><div class="kpi-label">Gross Profit</div><div class="kpi-value" style="font-size:20px;" id="pfProfit">Rs 0</div></div>
        </div>
      </div>
    </div>
    <div class="col-6 col-lg-3">
      <div class="card kpi-card"><span class="kpi-accent amber"></span>
        <div class="kpi-body" style="padding:14px;">
          <div class="kpi-icon bg-amber-soft" style="width:42px;height:42px;font-size:16px;"><i class="fa-solid fa-chart-line"></i></div>
          <div><div class="kpi-label">Margin</div><div class="kpi-value" style="font-size:20px;" id="pfMargin">—</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-7">
      <div class="card h-100">
        <div class="card-header"><span>Revenue vs Food Cost</span></div>
        <div class="card-body"><div class="bar-chart" id="pfChart"></div></div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card h-100">
        <div class="card-header"><span>Cost Summary</span></div>
        <div class="card-body" id="pfSplit"></div>
      </div>
    </div>
  </div>

  <div class="card mt-3">
    <div class="card-header"><span>Daily Profit</span></div>
    <div class="table-responsive">
      <table class="table table-hover">
        <thead>
          <tr><th>Date</th><th class="text-end">Revenue</th><th class="text-end">Food Cost (est.)</th><th class="text-end">Gross Profit</th><th class="text-end">Margin</th></tr>
        </thead>
        <tbody id="pfBody"></tbody>
      </table>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/helpers.js"></script>
<script src="../assets/js/components.js"></script>
<script>
function itemCost(name) {
  const r = DB.recipes.find(x => x.name === name);
  if (r) return r.cost / r.output;
  const base = name.replace(/ \([^)]*\)/, '').replace(/ \+ .*/, '');
  const m = DB.menu.find(x => x.name === base);
  return m ? m.baseCost : 0;
}

function renderProfit() {
  const orders = DB.orders.filter(o => o.status !== 'hold' && o.status !== 'cancelled');
  const byDay = {};
  orders.forEach(function (o) {
    byDay[o.date] = byDay[o.date] || { rev: 0, cost: 0 };
    byDay[o.date].rev += o.total;
    o.items.forEach(function (it) {
      const c = itemCost(it.name);
      if (c) byDay[o.date].cost += c * it.qty;
      else byDay[o.date].cost += it.price * it.qty * 0.6;
    });
  });

  const days = Object.keys(byDay).sort();
  const rev = orders.reduce((s, o) => s + o.total, 0);
  const cost = days.reduce((s, d) => s + byDay[d].cost, 0);
  const profit = rev - cost;
  const margin = rev ? Math.round((profit / rev) * 100) : 0;

  document.getElementById('pfRev').textContent = formatPKR(rev);
  document.getElementById('pfCost').textContent = formatPKR(cost);
  document.getElementById('pfProfit').textContent = formatPKR(profit);
  document.getElementById('pfMargin').textContent = margin + '%';

  const maxVal = Math.max(rev, cost, 1);
  barChart('pfChart', days.map(function (d) {
    return {
      label: d.split(' ')[0] + ' ' + d.split(' ')[1],
      bars: [
        { h: Math.round((byDay[d].rev / maxVal) * 100), title: d + ' revenue: ' + formatPKR(byDay[d].rev) },
        { h: Math.round((byDay[d].cost / maxVal) * 100), cls: 'second', title: d + ' cost: ' + formatPKR(byDay[d].cost) }
      ]
    };
  }));

  const foodPct = rev ? Math.round((cost / rev) * 100) : 0;
  document.getElementById('pfSplit').innerHTML =
    '<div class="bs-item"><span class="rank-chip" style="background:var(--success-soft);color:var(--success-dark);"><i class="fa-solid fa-sack-dollar"></i></span>' +
    '<div class="bs-meta"><div class="d-flex justify-content-between"><span class="bs-name">Revenue</span><span class="bs-amt">' + formatPKR(rev) + '</span></div>' +
    '<div class="progress mt-1"><div class="progress-bar bg-success" style="width:100%"></div></div></div></div>' +
    '<div class="bs-item"><span class="rank-chip" style="background:var(--danger-soft);color:var(--danger-dark);"><i class="fa-solid fa-drumstick-bite"></i></span>' +
    '<div class="bs-meta"><div class="d-flex justify-content-between"><span class="bs-name">Food cost</span><span class="bs-amt">' + formatPKR(cost) + '</span></div>' +
    '<div class="progress mt-1"><div class="progress-bar bg-danger" style="width:' + foodPct + '%"></div></div>' +
    '<div class="bs-sub">' + foodPct + '% of revenue (industry avg ~35%)</div></div></div>' +
    '<div class="bs-item"><span class="rank-chip" style="background:var(--violet-soft);color:var(--violet);"><i class="fa-solid fa-piggy-bank"></i></span>' +
    '<div class="bs-meta"><div class="d-flex justify-content-between"><span class="bs-name">Gross profit</span><span class="bs-amt">' + formatPKR(profit) + '</span></div>' +
    '<div class="progress mt-1"><div class="progress-bar bg-warning" style="width:' + (100 - foodPct) + '%"></div></div></div></div>';

  const body = document.getElementById('pfBody');
  if (!days.length) {
    body.innerHTML = emptyRow(5, 'No data available', 'Profits will appear once orders are recorded.');
    return;
  }
  body.innerHTML = days.map(function (d) {
    const p = byDay[d].rev - byDay[d].cost;
    const m = byDay[d].rev ? Math.round((p / byDay[d].rev) * 100) : 0;
    return '<tr><td class="cell-fw">' + d + '</td>' +
      '<td class="text-end">' + formatPKR(byDay[d].rev) + '</td>' +
      '<td class="text-end">' + formatPKR(byDay[d].cost) + '</td>' +
      '<td class="text-end cell-fw ' + (p >= 0 ? 'text-success' : 'text-danger') + '">' + formatPKR(p) + '</td>' +
      '<td class="text-end">' + m + '%</td></tr>';
  }).join('');
}

document.addEventListener('DOMContentLoaded', renderProfit);
</script>
</body>
</html>
